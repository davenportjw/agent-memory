<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Antigravity // Distributed AI System (Gemma 4 int4 & Gemini 3.8 Flash)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Antigravity">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Antigravity // Distributed AI System</title>
  <link rel="manifest" href="manifest.json">

  <!-- Typography: DM Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

  <style>
    :root {
      --canvas: #faf7f2;
      --ink: #1c1917;
      --border: #e6dfd5;
      --amber: #b45309;
      --sage: #3f6212;
    }
    body {
      background-color: var(--canvas);
      color: var(--ink);
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #faf7f2;
      transition: opacity 0.4s ease-out;
    }
    .loader-title {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.02em;
      color: #1c1917;
      margin-bottom: 6px;
    }
    .loader-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #78716c;
      margin-bottom: 24px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid #e6dfd5;
      border-top-color: #3f6212;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Edge Runtime Bridges (Cache-busted) -->
  <script>
    // Force purge of any stale service worker caches so updates are applied immediately
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if (window.caches) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <script src="js/chrome_prompt_api.js?v=155.2" defer></script>
  <script src="js/gemma_webgpu.js?v=155.2" defer></script>
</head>
<body>
  <div id="loading-screen">
    <div class="loader-title">ANTIGRAVITY // EDGE-CLOUD</div>
    <div class="loader-sub">Gemma 4 int4 · Gemini 3.8 Flash · Memory Graph</div>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
